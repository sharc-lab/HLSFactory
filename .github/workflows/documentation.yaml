name: Sphinx Documentation
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build-sphinx-docs:
    runs-on: ubuntu-latest
    steps:
      # The full repo is ~570 MB (mostly hls_dataset_sources); the docs only
      # need the docs, the Python sources, and the uv project files
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/
            /hlsfactory/
            !/hlsfactory/hls_dataset_sources/
            /pyproject.toml
            /uv.lock
            /README.md
            /LICENSE
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # autodoc2 reads the source statically, so the docs only need the
      # locked docs extra, not the hlsfactory package itself
      - name: Install docs dependencies
        run: uv sync --locked --extra docs --no-dev --no-install-project
      - name: Run Sphinx build
        run: uv run --no-sync sphinx-build -j auto -b html docs/source/ docs/build/
      - name: Check that the docs were built
        run: |
          test -f docs/build/index.html || { echo "Sphinx produced no index.html"; exit 1; }
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/
