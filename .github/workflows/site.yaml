name: Build and Deploy Docs Site
on:
  workflow_dispatch:
  workflow_call:

jobs:
  run-documentation:
    uses: ./.github/workflows/documentation.yaml
  deploy:
    needs: [run-documentation]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
