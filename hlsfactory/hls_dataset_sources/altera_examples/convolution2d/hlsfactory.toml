# Upstream commit: 0abae6d78af5daca3fe5d67e617ab037e58aff89
# Agilex7 report-target settings from the upstream CMake build.
design_name = "convolution2d"
dataset_name = "altera_examples"
tags = ["altera", "sycl", "reference_design", "convolution2d"]

[[flow_configs]]
flow_name = "AlteraHLSSynthFlow"
sources = "src/main.cpp"
cxxflags = "-Idesign_include -Iinclude -Wall -DPARALLEL_PIXELS=2 -DPIXEL_BITS=10 -DWINDOW_SZ=3 -DMAX_COLS=4096 -DTEST_CONV2D_ISOLATED=0"
target = "Agilex7"
fpga_flags = "-Xsoptimize=latency"

[[flow_configs]]
flow_name = "AlteraQuartusImplFlow"
sources = "src/main.cpp"
cxxflags = "-Idesign_include -Iinclude -Wall -DPARALLEL_PIXELS=2 -DPIXEL_BITS=10 -DWINDOW_SZ=3 -DMAX_COLS=4096 -DTEST_CONV2D_ISOLATED=0"
target = "Agilex7"
fpga_flags = "-Xsoptimize=latency"
