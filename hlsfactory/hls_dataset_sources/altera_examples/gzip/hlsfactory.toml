# Upstream commit: 0abae6d78af5daca3fe5d67e617ab037e58aff89
# Agilex7 report-target settings from the upstream CMake build.
# Use the documented single-engine variant to limit synthesis cost.
design_name = "gzip"
dataset_name = "altera_examples"
tags = ["altera", "sycl", "reference_design", "gzip"]

[[flow_configs]]
flow_name = "AlteraHLSSynthFlow"
sources = "src/gzip.cpp src/crc32.cpp src/WriteGzip.cpp src/CompareGzip.cpp src/gzipkernel.cpp"
cxxflags = "-Iinclude -Wall -DNUM_ENGINES=1"
target = "Agilex7"
fpga_flags = "-Xsseed=8 -Xsopt-arg=-nocaching -Xsnum-reorder=6"

[[flow_configs]]
flow_name = "AlteraQuartusImplFlow"
sources = "src/gzip.cpp src/crc32.cpp src/WriteGzip.cpp src/CompareGzip.cpp src/gzipkernel.cpp"
cxxflags = "-Iinclude -Wall -DNUM_ENGINES=1"
target = "Agilex7"
fpga_flags = "-Xsseed=8 -Xsopt-arg=-nocaching -Xsnum-reorder=6"
